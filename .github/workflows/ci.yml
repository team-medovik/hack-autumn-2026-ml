name: ML basic checks

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-generator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Generator tests (no model training)
        run: python -B -m unittest discover -s examples/risk/event-driven/tests
      - name: Point-in-time feature and label checks
        run: python -B -m unittest discover -s ml/tests -p test_event_driven_dataset.py
