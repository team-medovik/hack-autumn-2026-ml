name: Deploy generator

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generator-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, deploy]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy generator and verify from API network
        run: sudo env GITHUB_SHA="$GITHUB_SHA" python3 deploy/deploy-generator.py
