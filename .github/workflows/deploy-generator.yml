name: Deploy generator

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Explicit generator schedule profile; demo profiles preserve the current runId and event prefix
        required: true
        type: choice
        default: stored
        options:
          - stored
          - demo-stream-v1
          - demo-stream-v2
          - demo-stream-fast-v3

permissions:
  contents: read

concurrency:
  group: generator-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, deploy]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy generator and verify from API network
        env:
          GENERATOR_DEPLOY_PROFILE: ${{ inputs.profile }}
        run: sudo env GITHUB_SHA="$GITHUB_SHA" GENERATOR_DEPLOY_PROFILE="$GENERATOR_DEPLOY_PROFILE" python3 deploy/deploy-generator.py
