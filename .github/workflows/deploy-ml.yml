name: Deploy ML

on:
  workflow_run:
    workflows: ["ML basic checks"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ml-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: [self-hosted, linux, deploy]
    timeout-minutes: 30
    env:
      DEPLOY_ROOT: /home/kinoko/hack-autumn-2026/ml
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out the revision that passed CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Build the ML image
        shell: bash
        run: |
          set -euo pipefail
          docker network inspect backend >/dev/null
          docker build -f inference_service/Dockerfile \
            -t "hack-autumn-2026-ml:$DEPLOY_SHA" .

      - name: Skip a revision superseded in main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/ref/heads/main'
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
          })
          with urllib.request.urlopen(request, timeout=15) as response:
              current_sha = json.load(response)['object']['sha']

          is_current = current_sha == os.environ['DEPLOY_SHA']
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'deploy={str(is_current).lower()}\n')
          print('Revision is current:', is_current)
          PY

      - name: Deploy, verify and roll back on failure
        if: steps.current.outputs.deploy == 'true'
        env:
          ML_SERVICE_TOKEN: ${{ secrets.ML_SERVICE_TOKEN }}
        shell: bash
        run: bash deploy/deploy-ml.sh
