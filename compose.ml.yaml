services:
  ml-service:
    build:
      context: .
      dockerfile: inference_service/Dockerfile
    restart: unless-stopped
    environment:
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:?Set ML_SERVICE_TOKEN}
    ports: ["127.0.0.1:8012:8000"]
    networks: [ml-internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 20s
networks:
  ml-internal:
