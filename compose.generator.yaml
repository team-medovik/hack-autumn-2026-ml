services:
  generator-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: generator
      POSTGRES_USER: generator
      POSTGRES_PASSWORD: ${GENERATOR_POSTGRES_PASSWORD:-generator-local}
    volumes:
      - generator-postgres:/var/lib/postgresql/data
    networks: [generator-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U generator -d generator"]
      interval: 5s
      timeout: 3s
      retries: 10

  generator-worker:
    build:
      context: .
      dockerfile: generator_service/Dockerfile
    command: ["python", "-m", "generator_service.worker"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      GENERATOR_DATABASE_URL: ${GENERATOR_DATABASE_URL:-postgresql://generator:${GENERATOR_POSTGRES_PASSWORD:-generator-local}@generator-db:5432/generator}
      GENERATOR_RUN_KEY: ${GENERATOR_RUN_KEY:-default}
      GENERATOR_TIME_SCALE: ${GENERATOR_TIME_SCALE:-3600}
      GENERATOR_TICK_SECONDS: ${GENERATOR_TICK_SECONDS:-1}
      GENERATOR_MAX_STEP_SECONDS: ${GENERATOR_MAX_STEP_SECONDS:-3600}
      GENERATOR_START: ${GENERATOR_START:-2026-01-01T00:00:00Z}
      GENERATOR_DAYS: ${GENERATOR_DAYS:-365}
      GENERATOR_ACCOUNTS: ${GENERATOR_ACCOUNTS:-50}
      GENERATOR_SEED: ${GENERATOR_SEED:-20261024}
    depends_on:
      generator-db:
        condition: service_healthy
    networks: [generator-internal]

  generator-api:
    build:
      context: .
      dockerfile: generator_service/Dockerfile
    restart: unless-stopped
    environment:
      GENERATOR_DATABASE_URL: ${GENERATOR_DATABASE_URL:-postgresql://generator:${GENERATOR_POSTGRES_PASSWORD:-generator-local}@generator-db:5432/generator}
      GENERATOR_RUN_KEY: ${GENERATOR_RUN_KEY:-default}
      GENERATOR_SERVICE_TOKEN: ${GENERATOR_SERVICE_TOKEN:?Set GENERATOR_SERVICE_TOKEN}
    depends_on:
      generator-db:
        condition: service_healthy
    # Optional local debugging port, never bind this internal API on 0.0.0.0.
    ports: ["127.0.0.1:8011:8000"]
    networks: [generator-internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 10s

volumes:
  generator-postgres:

networks:
  generator-internal:
